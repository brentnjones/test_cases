---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testcase-tracker
  labels:
    app: testcase-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testcase-tracker
  template:
    metadata:
      labels:
        app: testcase-tracker
    spec:
      containers:
      - name: testcase-tracker
        image: image-registry.openshift-image-registry.svc:5000/YOUR_PROJECT/testcase-tracker:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-name
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: testcase-tracker
  labels:
    app: testcase-tracker
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: testcase-tracker
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: testcase-tracker
  labels:
    app: testcase-tracker
spec:
  to:
    kind: Service
    name: testcase-tracker
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
